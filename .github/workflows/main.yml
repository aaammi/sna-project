name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
    - name: Get the code from GitHub
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r worker/requirements.txt

    - name: Check for Python syntax errors (Linting)
      run: |
        flake8 worker/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests
      run: |
        cd worker
        python -m unittest test_worker.py -v
